<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/img/livro.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=calendar_month" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Bibliotec</title>
    <style>
        /* Estilos para o modal de detalhes */
        .modal {
            display: block;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.7);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 30px;
            border: 1px solid #888;
            border-radius: 10px;
            width: 80%;
            max-width: 600px;
            position: relative;
        }

        .modal-content img {
            width: 100%;
            max-width: 300px;
            margin: 0 auto 20px;
            display: block;
            border-radius: 8px;
        }

        .close {
            color: #aaa;
            position: absolute;
            right: 20px;
            top: 10px;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: #000;
        }
    </style>
</head>

<body>
    <div class="inicio">
        <header>
            <img class="logo" src="/img/blibliotec.png" alt="Bibliotec Logo">
            <nav>
                <button>
                    <a href="catalogo.html">Catálogo</a>
                </button>
                <button>
                    <a href="login.html">Sair</a>
                </button>
            </nav>
            <h3>"Quando a leitura encontra o agora"</h3>
        </header>

        <!-- Formulário de Busca -->
        <form id="search-form">
            <label for="search-input">Pesquise:</label>
            <input type="search" id="search-input" name="titulo" placeholder="Nome do livro ou autor..." />
            <button type="submit">Pesquisar</button>
        </form>

        <img class="background" src="/img/biblioteca.jpg" alt="Biblioteca">
        <h1>Destaques</h1>

        <!-- Container dos Livros -->
        <div class="Destaques" id="livros-destaques">
            <!-- Os livros serão carregados aqui dinamicamente -->
        </div>
    </div>

    <!-- Menu de Eventos -->
    <div class="events">
        <ul id="Eventos">
            <button class="material-symbols-outlined">
                calendar_month
            </button>
            <li data-date="2025-11-12">Lançamento de livros</li>
            <li data-date="2025-11-24">Palestra</li>
            <li data-date="2025-12-02">Oficina de escrita</li>
            <li data-date="2025-12-12">Feira de livros</li>
        </ul>
    </div>

    <!-- Script Principal -->
    <script src="js/app.js"></script>
</body>

</html>

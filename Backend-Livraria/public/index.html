<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>BIBLIOTEC - Sistema de Biblioteca</title>
</head>
<body>
    <header>
        <img class="logo" src="/img/blibliotec.png" alt="BIBLIOTEC">
        <h3>"Quando a leitura encontra o agora"</h3>
        <nav>
            <button><a href="/catalogo.html">Catálogo</a></button>
        </nav>
    </header>

    <div class="search-section">
        <form id="search-form">
            <input type="search" id="search-input" placeholder="Nome do livro ou autor...">
            <button type="submit">Pesquisar</button>
        </form>
    </div>

    <div class="destaques">
        <h1>Destaques</h1>
        <div id="livros-container"></div>
    </div>

    <div class="events">
        <h2>Próximos Eventos</h2>
        <ul id="Eventos">
            <li>📅 Lançamento de livros</li>
            <li>🎤 Palestra com autores</li>
            <li>✍️ Oficina de escrita</li>
            <li>📚 Feira de livros</li>
        </ul>
    </div>

    <div class="overlay" id="overlay"></div>
    <div id="livro-detalhe"></div>

    <script>
      async function carregarLivros() {
        try {
          const res = await fetch('/livros');
          const livros = await res.json();
          const container = document.getElementById('livros-container');
          container.innerHTML = livros.map(l => `
            <div class="livro-card">
              <img src="${l.caminho_capa}" alt="${l.titulo}" onerror="this.src='/img/placeholder.png'">
              <h3>${l.titulo}</h3>
              <p>${l.autor || 'Autor desconhecido'}</p>
              <button onclick="obterLivro(${l.idLivro})">Ver Detalhes</button>
            </div>
          `).join('');
        } catch (err) {
          console.error('Erro ao carregar livros:', err);
        }
      }

      async function obterLivro(idLivro) {
        try {
          const res = await fetch(`/livros/${idLivro}`);
          const livro = await res.json();
          document.getElementById('livro-detalhe').innerHTML = `
            <h2>${livro.titulo}</h2>
            <p><strong>Autor:</strong> ${livros.autor || 'Desconhecido'}</p>
            <p><strong>Gênero:</strong> ${livros.genero || '-'}</p>
            <p><strong>Sinopse:</strong> ${livros.sinopse || 'Sem descrição'}</p>
            <p><strong>Disponível:</strong> ${livros.disponivel ? '✅ Sim' : '❌ Não'}</p>
            <button onclick="fecharDetalhes()">Fechar</button>
          `;
          document.getElementById('livro-detalhe').classList.add('ativo');
          document.getElementById('overlay').classList.add('ativo');
        } catch (err) {
          console.error('Erro:', err);
        }
      }

      function fecharDetalhes() {
        document.getElementById('livro-detalhe').classList.remove('ativo');
        document.getElementById('overlay').classList.remove('ativo');
      }

      document.getElementById('search-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const q = document.getElementById('search-input').value.trim();
        if (!q) return carregarLivros();
        try {
          const res = await fetch(`/livros/buscar?q=${encodeURIComponent(q)}`);
          const livros = await res.json();
          const container = document.getElementById('livros-container');
          container.innerHTML = livros.map(l => `
            <div class="livro-card">
              <img src="${l.caminho_capa}" alt="${l.titulo}" onerror="this.src='/img/placeholder.png'">
              <h3>${l.titulo}</h3>
              <p>${l.autor || 'Autor desconhecido'}</p>
              <button onclick="obterLivro(${l.idLivro})">Ver Detalhes</button>
            </div>
          `).join('');
        } catch (err) {
          console.error('Erro na busca:', err);
        }
      });

      document.getElementById('overlay').addEventListener('click', fecharDetalhes);
      carregarLivros();
    </script>
</body>
</html>

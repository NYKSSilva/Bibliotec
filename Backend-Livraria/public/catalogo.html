<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/catalogo.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu" />
    <link rel="icon" href="/img/livro.png">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_circle" />
    <title>Catálogo Bibliotec</title>
</head>

<body>
    <header>
        <img class="logo" src="/img/blibliotec.png" alt="bibliotec">
        <nav>
            <button>
                <a href="inicio.html">inicio</a>
            </button>
        </nav>

    </header>
    <form action="/livros/titulo" method="get">
        <label for="search-input">Pesquise:</label>
        <input type="search" id="search-input" name="titulo" placeholder="Nome do livro ou autor..." />
        <button type="submit">Pesquisar</button>
    </form>
    <div class="menu">
            <button onclick="menu.hidden^=1">
                ☰
            </button>
            <ul id="menu" hidden>
                <li>Tudo</li>
                <li>Romance</li>
                <li>Ficção</li>
                <li>Infantil</li>
                <li>Fantasia</li>
                <li>Ficção Cientifica</li>
                <li>Mistério</li>
                <li>Livro Didático</li>
            </ul>
        </div>
    <img class="background" src="/img/biblioteca.jpg" alt="">

    <div class="livros">
    </div>
    <footer>
        <h2>Conheça a nosssa unidade</h2>
        <a href="https://sp.senai.br/unidade/metalurgia/" target="_blank">SENAI Nadir Dias de Figueredo</a>
    </footer>
    <script src="js/catalogo.js"></script>
</body>

</html>

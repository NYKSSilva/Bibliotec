<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/cadastro.aluno.css">
    <link rel="icon" href="./public/img/livro.png">
    <title>Cadastro Aluno</title>
</head>

<body>
    <div class="catalogo">
        <header>
            <img class="logo" src="public/img/blibliotec.png" alt="bibliotec">
        </header>
        <img class="background" src="public/img/biblioteca.jpg" alt="">
        <div class="login">
            <form id="CadastroForm">
    <h1> Cadastre um novo aluno</h1>
    
    <div class="form-row">
        <div class="form-group">
            <label for="nome">Nome:</label>
            <input id="nome" name="nome" type="text" required placeholder="Seu nome">
        </div>
        <div class="form-group">
            <label for="cpf">CPF:</label>
            <input id="cpf" name="cpf" type="number" required placeholder="Ex: 38989284031">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="email">Email:</label>
            <input id="email" name="email" type="email" required placeholder="ex: aluno@aluno.senai.br">
        </div>
        <div class="form-group">
            <label for="matricula">Matricula:</label>
            <input id="matricula" name="matricula" type="number" required placeholder="ex: 1024589">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="curso">Curso:</label>
            <input id="curso" name="curso" type="text" required placeholder="ex: tecnico em...">
        </div>
        <div class="form-group">
            <label for="celular">telefone:</label>
            <input id="celular" name="celular" type="tel" required placeholder="ex: 11982476229">
        </div>
    </div>
    
    <div class="form-group full-width">
        <label for="data_nascimento">Data de nascimento do aluno</label>
        <input id="data_nascimento" name="data_nascimento" type="date" required >
    </div>
    <div class="form-group full-width">
        <label for="senha">Senha do aluno</label>
        <input id="senha" name="senha" type="password" required >
    </div>
    
    <button type="submit">Entrar</button>
</form>
        </div>
    </div>
    <script src="./js/cadastro.aluno.js"></script>
    <footer>
        <h2>Conheça a nosssa unidade</h2>
        <a href="https://sp.senai.br/unidade/metalurgia/" target="_blank">SENAI Nadir Dias de Figueredo</a>
    </footer>
</body>

</html>
